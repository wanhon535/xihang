<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成本台账 - 汐航</title><script src="/theme-bootstrap.js"></script><link rel="stylesheet" href="/src/styles/styles.css">
    <link rel="stylesheet" href="/src/styles/ledger.css"><link rel="stylesheet" href="/src/styles/admin-layout.css"></head>
<body class="console-page vben-shell ledger-page"><aside class="side-rail"><a class="side-logo" href="/"><span>汐</span><strong>汐航</strong></a><nav class="side-nav"><a href="/"><b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5.5 9v11h13V9M9 20v-6h6v6"/></svg></b><span>工作台</span></a><a href="/vault.html"><b><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4"/><path d="m10.5 12.5 8-8 2 2-2 2 2 2-3 3-2-2-2 2"/></svg></b><span>星钥库</span></a><a href="/admin.html"><b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 6v5c0 5-3.4 8.3-8 10-4.6-1.7-8-5-8-10V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg></b><span>管理中枢</span></a><a href="/ledger.html" class="active" aria-current="page"><b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></b><span>成本台账</span></a></nav><div class="rail-note"><span id="userName">身份验证中</span><small>管理员共享台账</small></div></aside>
<main class="console-main"><header class="console-topbar"><div><p class="eyebrow">COST LEDGER</p><h1>成本台账</h1><p>每一笔支出，清晰可追溯。所有管理员共享记录。</p></div><button id="logoutBtn" type="button">退出</button></header>
<p id="status" role="status" aria-live="polite">正在验证管理员身份…</p>
<div id="ledgerWorkspace" hidden>
<section class="ledger-stats" aria-label="全部记录汇总"><article><span>总成本</span><strong id="total">—</strong><small>全部记录 · 元</small></article><article><span>本月成本</span><strong id="monthTotal">—</strong><small id="summaryMonth">本月 · 元</small></article><article><span>待付款</span><strong id="unpaid">—</strong><small>全部未付款 · 元</small></article></section>
<section class="ledger-panel"><div class="ledger-toolbar"><h2>支出明细</h2><div><button id="refreshBtn" type="button">刷新</button> <button id="newBtn" type="button" class="ledger-primary">＋ 新增成本</button></div></div>
<div class="ledger-filters"><label>搜索<input id="search" type="search" placeholder="项目、说明、经办人、备注…"></label><label>月份<input id="month" type="month"></label><label>项目<select id="project"><option value="">全部项目</option></select></label><label>类别<select id="category"><option value="">全部类别</option></select></label><label>付款状态<select id="paymentStatus"><option value="">全部状态</option><option value="paid">已付款</option><option value="unpaid">待付款</option></select></label><label>排序<select id="sort"><option value="date-desc">日期：新到旧</option><option value="date-asc">日期：旧到新</option><option value="amount-desc">金额：高到低</option><option value="amount-asc">金额：低到高</option><option value="project-asc">项目名称</option></select></label><label>分组<select id="group"><option value="">不分组</option><option value="project">按项目</option><option value="category">按类别</option><option value="month">按月份</option><option value="paymentStatus">按付款状态</option></select></label><button id="resetBtn" type="button">重置筛选</button></div>
<section class="ledger-insights" aria-label="筛选结果概览">
<div class="payment-overview"><span>当前筛选 · 付款进度</span><strong id="paymentProgressLabel">暂无记录</strong><progress id="paymentProgress" max="100" value="0" aria-label="按金额计算的付款进度"></progress><small id="paymentProgressHint">新增支出后查看付款情况</small></div>
<div class="category-overview"><h3>支出分类 <small>当前筛选 · 金额前五</small></h3><div id="categoryBreakdown"></div></div>
</section><p id="resultCount" aria-live="polite"></p><div class="ledger-table-scroll" tabindex="0" role="region" aria-label="成本明细表，可横向滚动"><table><thead><tr><th>日期</th><th>项目</th><th>类别</th><th>说明</th><th>金额（元）</th><th>付款状态</th><th>经办人</th><th>备注</th><th>凭证</th><th>创建人 / 时间</th><th>修改人 / 时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></div>
</main>
<dialog id="editDialog" aria-labelledby="dialogTitle"><form id="entryForm"><h2 id="dialogTitle">新增成本</h2><p>必填项以 * 标注；金额最多两位小数。</p><div class="ledger-form-grid"><label>日期 *<input name="date" type="date" min="1000-01-01" max="9999-12-31" required></label><label>项目 *<input name="project" maxlength="160" list="projectSuggestions" placeholder="输入或从建议中选择" required><small>新项目去管理中枢 → 项目管理里登记，这里会自动带出建议</small></label><label>类别 *<input name="category" maxlength="120" list="categorySuggestions" required></label><label>金额（元）*<input name="amount" inputmode="decimal" placeholder="0.00" pattern="(0|[1-9][0-9]{0,8})(\.[0-9]{1,2})?" required></label><label>付款状态 *<select name="paymentStatus"><option value="unpaid">待付款</option><option value="paid">已付款</option></select></label><label>经办人 *<input name="handler" maxlength="160" required></label><label class="ledger-wide">说明<textarea name="description" maxlength="1000" rows="2"></textarea></label><label class="ledger-wide">备注<textarea name="notes" maxlength="2000" rows="2"></textarea></label><label class="ledger-wide">凭证（PDF / PNG / JPEG，最大 3 MiB）<input name="attachment" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg"><small id="attachmentHint">可选</small></label></div><datalist id="projectSuggestions"></datalist><datalist id="categorySuggestions"></datalist><p id="formStatus" role="alert"></p><div class="ledger-dialog-actions"><button id="cancelBtn" type="button">取消</button><button id="saveBtn" type="submit" class="ledger-primary">保存</button></div></form></dialog>
<script type="module" src="/src/pages/ledger.js"></script></body></html>
