<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工作台 - 汐航</title>
    <link rel="stylesheet" href="/src/styles/styles.css" />
    <link rel="stylesheet" href="/src/styles/admin-layout.css" />

  </head>
  <body class="console-page vben-shell home-page dashboard-page">
    <aside class="side-rail" aria-label="主导航">
      <a class="side-logo" href="/" aria-label="汐航">
        <span>汐</span>
        <strong>汐航</strong>
      </a>
      <nav class="side-nav">
        <a class="active" href="/"><b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5.5 9v11h13V9M9 20v-6h6v6"/></svg></b><span>工作台</span></a>
        <a href="/vault.html"><b><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4"/><path d="m10.5 12.5 8-8 2 2-2 2 2 2-3 3-2-2-2 2"/></svg></b><span>星钥库</span></a>
        <a class="admin-only hidden" href="/admin.html"><b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 6v5c0 5-3.4 8.3-8 10-4.6-1.7-8-5-8-10V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg></b><span>管理中枢</span></a>
        <a class="admin-only hidden" href="/ledger.html"><b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></b><span>成本台账</span></a>
      </nav>
      <div class="rail-note">
        <span id="accountName">-</span>
        <small id="accountRole">-</small>
      </div>
    </aside>

    <main class="console-main">
      <header class="console-topbar dashboard-topbar">
        <div>
          <p class="eyebrow">XIHANG ACCESS</p>
          <h1>工作台</h1>
        </div>
        <div class="console-user">
          <span id="userName">-</span>
          <button id="themeToggleBtn" type="button">外观</button>
          <button id="logoutBtn" type="button">退出</button>
        </div>
      </header>


      <section class="home-command-grid" aria-label="工作台概览">
        <section class="dashboard-hero">
          <div>
            <p class="eyebrow">XIHANG COMMAND</p>
            <h2>欢迎回来，今天要处理的事都在这里。</h2>
            <p>集中访问业务应用、安全管理项目凭证，开始今天的工作。</p>
          </div>

        </section>

        <section id="stats-grid" class="dashboard-stats" aria-label="统计概览">
          <article>
            <svg class="stat-semantic-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11H3Z"/></svg>
            <span>应用分组</span>
            <strong id="groupCount">0</strong>
            <small>Groups</small>
          </article>
          <article>
            <svg class="stat-semantic-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0M13 7l1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0"/></svg>
            <span>系统入口</span>
            <strong id="siteCount">0</strong>
            <small>Entries</small>
          </article>
          <article>
            <svg class="stat-semantic-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9m-4 4 3 3m-6 0 3 3"/></svg>
            <span>星钥记录</span>
            <strong id="keyCount">0</strong>
            <small>Keys</small>
          </article>
          <article>
            <svg class="stat-semantic-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M13 6.5h4M13 17.5h4"/></svg>
            <span>基础设施</span>
            <strong id="infraCount">0</strong>
            <small>Infrastructure</small>
          </article>
        </section>
      </section>

      <div class="workspace-columns">
      <section id="app-map" class="board directory-board dashboard-app-map">
        <div class="board-head">
          <div>
            <p class="panel-label">Application Map</p>
            <h2>全部应用</h2>
            <p id="directorySummary">正在同步站点配置</p>
          </div>
          <label class="search-box">
            <span>搜索应用</span>
            <input id="searchInput" autocomplete="off" placeholder="名称、说明或标签" />
          </label>
        </div>
        <div id="groupFilters" class="directory-filters" role="group" aria-label="按应用分组筛选"></div>
        <div id="content" class="workspace-loading"><span class="state-icon" aria-hidden="true">⌕</span><strong>正在加载应用</strong><small>正在同步你有权限访问的站点入口。</small></div>
      </section>



      </div>
      <footer class="console-footer">
        <span>Version 0.1.0</span>
        <span>© 2026 云南汐构信息技术有限公司</span>
        <span>汐航</span>
      </footer>
    </main>

    <script type="module" src="/src/pages/main.js?v=20260523-theme"></script>
  </body>
</html>
