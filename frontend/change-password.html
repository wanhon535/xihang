<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>修改密码 - 汐航</title>
    <link rel="stylesheet" href="/src/styles/styles.css" />
  </head>
  <body class="password-reference-page">
    <main id="change-password-page" class="password-stage">
      <section id="change-password-card" class="password-reset-card">
        <div id="lock-icon" class="password-lock">锁</div>
        <p class="eyebrow">SECURITY REQUIRED</p>
        <h1 id="change-password-title">设置新密码</h1>
        <p id="change-password-subtitle" class="password-subtitle">首次登录或管理员重置密码后，需要立即设置自己的新密码。</p>

        <p id="errorText" class="error hidden"></p>
        <form id="changePasswordForm" class="password-reset-form">
          <label id="current-password-group" class="field">
            <span>当前临时密码</span>
            <input id="currentPasswordInput" class="field-input" name="currentPassword" type="password" placeholder="输入当前临时密码" autocomplete="current-password" />
          </label>

          <label id="new-password-group" class="field">
            <span>新密码</span>
            <input id="nextPasswordInput" class="field-input" name="nextPassword" type="password" placeholder="至少 8 位，建议包含大小写和数字" autocomplete="new-password" />
          </label>

          <div id="password-strength" class="password-strength">
            <span id="password-strength-bar"></span>
            <b id="password-strength-text">未填写</b>
          </div>
          <p id="password-hint" class="password-hint">强密码建议至少 12 位，并包含大小写字母、数字和符号。</p>

          <label id="confirm-password-group" class="field">
            <span>确认新密码</span>
            <input id="confirmPasswordInput" class="field-input" name="confirmPassword" type="password" placeholder="再次输入新密码" autocomplete="new-password" />
          </label>

          <button id="submit-btn" class="primary-btn login-submit" type="submit">确认修改</button>
        </form>
        <p class="hint">修改完成后将进入工作台，星钥库记录仍按个人账号隔离。</p>
      </section>

      <footer class="auth-footer password-footer">
        <span>Version 0.1.0</span>
        <span>© 2026 云南汐构信息技术有限公司</span>
        <span>汐航</span>
      </footer>
    </main>
    <script type="module" src="/src/pages/change-password.js"></script>
  </body>
</html>
