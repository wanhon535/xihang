<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - TideSail 汐航</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><span>TideSail</span><small>汐航</small></a>
      <nav class="topnav"><span>钉钉登录</span></nav>
    </header>
    <main class="login-page">
      <section class="login-card">
        <p class="eyebrow">TIDESAIL</p>
        <h1>登录汐航</h1>
        <p class="muted">登录后访问 TideSail 汐航。管理员账号可进入后台维护全部分组和站点。</p>
        <p id="errorText" class="error hidden"></p>
        <a id="loginBtn" class="primary-btn" href="#">使用钉钉扫码</a>
        <div class="divider"><span>或使用管理员账号</span></div>
        <form id="passwordLoginForm" class="login-form">
          <input id="usernameInput" class="field-input" name="username" placeholder="管理员账号" autocomplete="username" value="admin" />
          <input id="passwordInput" class="field-input" name="password" type="password" placeholder="管理员密码" autocomplete="current-password" />
          <button class="plain-btn login-submit" type="submit">账号密码登录</button>
        </form>
        <p class="hint">账号密码用于本平台后台管理；钉钉扫码用于团队统一登录。</p>
      </section>
    </main>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
